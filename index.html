<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <link href="/src/style.css" rel="stylesheet">
    <title>Lumina Memories - Tu álbum de fotos privado y seguro</title>
    <meta name="description" content="Lumina Memories es la plataforma ideal para guardar y compartir tus recuerdos de forma privada. Crea álbumes para bodas, eventos y momentos especiales." />
    <meta name="keywords" content="Lumina, Memories, álbum fotos, boda, privado, compartir fotos, eventos" />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://luminamemories.netlify.app/" />
    <meta property="og:title" content="Lumina Memories - Tu álbum de fotos privado" />
    <meta property="og:description" content="Guarda tus recuerdos más preciados de forma segura. Álbumes anidados, alta calidad y privacidad total." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200&auto=format&fit=crop" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://luminamemories.netlify.app/" />
    <meta property="twitter:title" content="Lumina Memories" />
    <meta property="twitter:description" content="La mejor forma de compartir fotos de tu boda o evento especial." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1200&auto=format&fit=crop" />

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
