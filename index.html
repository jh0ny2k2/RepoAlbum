<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <link href="/src/style.css" rel="stylesheet">
    <title>Lumina - Share Your Memories</title>
    <meta name="description" content="Create, organize, and share your most precious memories with Lumina. Simple, private, and beautiful." />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://luminamemories.netlify.app/" />
    <meta property="og:title" content="Lumina - Share Your Memories" />
    <meta property="og:description" content="Create, organize, and share your most precious memories with Lumina. Simple, private, and beautiful." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=1200&auto=format&fit=crop" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://luminamemories.netlify.app/" />
    <meta property="twitter:title" content="Lumina - Share Your Memories" />
    <meta property="twitter:description" content="Create, organize, and share your most precious memories with Lumina. Simple, private, and beautiful." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?q=80&w=1200&auto=format&fit=crop" />

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
